name: MILAN Live Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: milan-live-auto
  cancel-in-progress: false

jobs:
  auto-update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Live-UI-Update
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare MILAN workspace
        env:
          MILAN_GH_TOKEN: ${{ secrets.MILAN_GH_TOKEN }}
        run: |
          git clone "https://github.com/Ignite-boy/MILAN.git" milan
          cd milan
          git config user.name "MILAN Live UI Bot"
          git config user.email "bot@milanlife.in"

      - name: AI generate and patch UI
        working-directory: milan
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            echo "AI UI attempt $attempt/3"
            python3 ../scripts/milan_ai_update.py
            if ! git diff --quiet; then
              echo "REAL UI CHANGE GENERATED"
              exit 0
            fi
            echo "No valid UI patch yet; trying another free model/attempt..."
          done
          echo "No real UI change generated after 3 free attempts."

      - name: Validate AI changes
        working-directory: milan
        run: |
          if git diff --quiet; then
            echo "NO_AI_CHANGES=true" >> "$GITHUB_ENV"
            echo "No AI changes this cycle."
            exit 0
          fi

          git diff --check

          changed_js="$(git diff --name-only -- '*.js')"
          if [ -n "$changed_js" ]; then
            while IFS= read -r file; do
              [ -n "$file" ] && node --check "$file"
            done <<< "$changed_js"
          fi

          bad="$(git diff --name-only | grep -Ev '^frontend/.*\.(html|css|js)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unsafe files changed:"
            echo "$bad"
            exit 1
          fi

          echo "NO_AI_CHANGES=false" >> "$GITHUB_ENV"

      - name: Create verified branch
        if: env.NO_AI_CHANGES == 'false'
        working-directory: milan
        env:
          MILAN_GH_TOKEN: ${{ secrets.MILAN_GH_TOKEN }}
        run: |
          BRANCH="auto-ui-${GITHUB_RUN_ID}"
          echo "AUTO_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_RUN_ID" > frontend/milan-build.txt
          git switch -c "$BRANCH"
          git add frontend
          git diff --cached --check
          SUMMARY="$(cat /tmp/milan-ai-summary 2>/dev/null || true)"
          SUMMARY="$(printf '%s' "$SUMMARY" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | sed 's/^ *//; s/ *$//' | cut -c1-160)"
          COMMIT_TITLE="$(cat /tmp/milan-ai-commit-title 2>/dev/null || true)"
          COMMIT_TITLE="$(printf '%s' "$COMMIT_TITLE" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | sed 's/^ *//; s/ *$//' | cut -c1-120)"
          test -n "$SUMMARY"
          test "$SUMMARY" != "Improve MILAN UI"
          test -n "$COMMIT_TITLE" || COMMIT_TITLE="$SUMMARY"

          COMMIT_NAME="feat(ui): $COMMIT_TITLE (cycle #$GITHUB_RUN_NUMBER)"
          echo "UI_COMMIT_NAME=$COMMIT_NAME" >> "$GITHUB_ENV"

          git commit -m "$COMMIT_NAME"
          COMMIT_SHA="$(git rev-parse HEAD)"
          echo "UI_COMMIT_SHA=$COMMIT_SHA" >> "$GITHUB_ENV"

          {
            echo "## 🚀 MILAN Live UI Update"
            echo
            echo "**Commit:** \`$COMMIT_NAME\`"
            echo
            echo "**Commit SHA:** \`$COMMIT_SHA\`"
            echo
            echo "**Manual testing:** inspect this exact commit in the MILAN repository."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "========================================"
          echo "UI COMMIT NAME: $COMMIT_NAME"
          echo "UI COMMIT SHA:  $COMMIT_SHA"
          echo "========================================"

          git push "https://x-access-token:${MILAN_GH_TOKEN}@github.com/Ignite-boy/MILAN.git" "$BRANCH"

      - name: Create verification PR
        if: env.NO_AI_CHANGES == 'false'
        env:
          GH_TOKEN: ${{ secrets.MILAN_GH_TOKEN }}
        run: |
          gh pr create --repo Ignite-boy/MILAN --base main --head "$AUTO_BRANCH" --title "$UI_COMMIT_NAME" --body "Automated UI change. Main is changed only after validation."

      - name: Verify PR branch
        if: env.NO_AI_CHANGES == 'false'
        working-directory: milan
        run: |
          git diff --check origin/main...HEAD
          changed_js="$(git diff --name-only origin/main...HEAD -- '*.js')"
          if [ -n "$changed_js" ]; then
            while IFS= read -r file; do
              [ -n "$file" ] && node --check "$file"
            done <<< "$changed_js"
          fi

      - name: Merge verified PR
        if: env.NO_AI_CHANGES == 'false'
        env:
          GH_TOKEN: ${{ secrets.MILAN_GH_TOKEN }}
        run: |
          PR_NUMBER="$(gh pr list --repo Ignite-boy/MILAN --head "$AUTO_BRANCH" --base main --state open --json number --jq '.[0].number')"
          test -n "$PR_NUMBER"
          gh pr merge "$PR_NUMBER" --repo Ignite-boy/MILAN --squash --delete-branch

      - name: Verify production deployment
        if: env.NO_AI_CHANGES == 'false'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          for i in $(seq 1 30); do
            code="$(curl -L -s -o /tmp/milan-home -w '%{http_code}' --max-time 20 "https://milanlife.in/?_milan_run=${RUN_ID}")"
            marker="$(curl -L -s --max-time 20 "https://milanlife.in/milan-build.txt?_milan_run=${RUN_ID}" || true)"
            echo "Deploy check $i/30: HTTP=$code MARKER=$marker"
            if [ "$code" = "200" ] && [ "$marker" = "$RUN_ID" ]; then
              echo "DEPLOYMENT SUCCESSFUL"
              exit 0
            fi
            sleep 20
          done
          exit 1


      - name: Trigger next continuous cycle
        if: success()
        env:
          GH_TOKEN: ${{ secrets.MILAN_GH_TOKEN }}
        run: |
          echo "GREEN CYCLE COMPLETE — STARTING NEXT UI IMPROVEMENT"
          for attempt in 1 2 3 4 5; do
            if gh workflow run milan-live-auto.yml --repo Ignite-boy/Live-UI-Update --ref main; then
              echo "NEXT UI CYCLE TRIGGERED"
              exit 0
            fi
            echo "Trigger attempt $attempt failed; retrying..."
            sleep 10
          done
          echo "Unable to trigger next cycle after 5 attempts"
          exit 1
