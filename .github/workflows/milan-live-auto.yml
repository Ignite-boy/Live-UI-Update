name: MILAN Live Auto Update

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milan-live-auto
  cancel-in-progress: false

jobs:
  auto-update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Live-UI-Update
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare MILAN workspace
        env:
          MILAN_GH_TOKEN: ${{ secrets.MILAN_GH_TOKEN }}
        run: |
          git clone "https://github.com/Ignite-boy/MILAN.git" milan
          cd milan
          git config user.name "MILAN Live UI Bot"
          git config user.email "bot@milanlife.in"

      - name: AI generate and patch UI
        working-directory: milan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 ../scripts/milan_ai_update.py

      - name: Validate AI changes
        working-directory: milan
        run: |
          if git diff --quiet; then
            echo "NO_AI_CHANGES=true" >> "$GITHUB_ENV"
            echo "No AI changes this cycle."
            exit 0
          fi

          git diff --check

          changed_js="$(git diff --name-only -- '*.js')"
          if [ -n "$changed_js" ]; then
            while IFS= read -r file; do
              [ -n "$file" ] && node --check "$file"
            done <<< "$changed_js"
          fi

          bad="$(git diff --name-only | grep -Ev '^frontend/.*\.(html|css|js)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unsafe files changed:"
            echo "$bad"
            exit 1
          fi

          echo "NO_AI_CHANGES=false" >> "$GITHUB_ENV"

      - name: Create verified branch
        if: env.NO_AI_CHANGES == 'false'
        working-directory: milan
        env:
          MILAN_GH_TOKEN: ${{ secrets.MILAN_GH_TOKEN }}
        run: |
          BRANCH="auto-ui-${GITHUB_RUN_ID}"
          echo "AUTO_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_RUN_ID" > frontend/milan-build.txt
          git switch -c "$BRANCH"
          git add frontend
          git diff --cached --check
          git commit -m "feat: automated MILAN UI improvement"
          git push "https://x-access-token:${MILAN_GH_TOKEN}@github.com/Ignite-boy/MILAN.git" "$BRANCH"

      - name: Create verification PR
        if: env.NO_AI_CHANGES == 'false'
        env:
          GH_TOKEN: ${{ secrets.MILAN_GH_TOKEN }}
        run: |
          gh pr create             --repo Ignite-boy/MILAN             --base main             --head "$AUTO_BRANCH"             --title "Automated MILAN UI update ${GITHUB_RUN_ID}"             --body "Automated UI change. Main is changed only after validation."

      - name: Verify PR branch
        if: env.NO_AI_CHANGES == 'false'
        working-directory: milan
        run: |
          git diff --check origin/main...HEAD
          changed_js="$(git diff --name-only origin/main...HEAD -- '*.js')"
          if [ -n "$changed_js" ]; then
            while IFS= read -r file; do
              [ -n "$file" ] && node --check "$file"
            done <<< "$changed_js"
          fi

      - name: Merge verified PR
        if: env.NO_AI_CHANGES == 'false'
        env:
          GH_TOKEN: ${{ secrets.MILAN_GH_TOKEN }}
        run: |
          PR_NUMBER="$(gh pr list --repo Ignite-boy/MILAN --head "$AUTO_BRANCH" --base main --state open --json number --jq '.[0].number')"
          test -n "$PR_NUMBER"
          gh pr merge "$PR_NUMBER" --repo Ignite-boy/MILAN --squash --delete-branch

      - name: Verify production deployment
        if: env.NO_AI_CHANGES == 'false'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          for i in $(seq 1 30); do
            code="$(curl -L -s -o /tmp/milan-home -w '%{http_code}' --max-time 20 "https://milanlife.in/?_milan_run=${RUN_ID}")"
            marker="$(curl -L -s --max-time 20 "https://milanlife.in/milan-build.txt?_milan_run=${RUN_ID}" || true)"
            echo "Deploy check $i/30: HTTP=$code MARKER=$marker"
            if [ "$code" = "200" ] && [ "$marker" = "$RUN_ID" ]; then
              echo "DEPLOYMENT SUCCESSFUL"
              exit 0
            fi
            sleep 20
          done
          exit 1

      - name: Wait 5 minutes before next cycle
        if: success()
        run: |
          echo "CURRENT CYCLE GREEN"
          echo "Waiting 5 minutes before next cycle..."
          sleep 300

      - name: Trigger next continuous cycle
        if: success()
        env:
          GH_TOKEN: ${{ secrets.MILAN_GH_TOKEN }}
        run: |
          gh workflow run milan-live-auto.yml             --repo Ignite-boy/Live-UI-Update             --ref main
          echo "NEXT CYCLE TRIGGERED"
