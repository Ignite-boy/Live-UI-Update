name: MILAN Live Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: milan-live-auto
  cancel-in-progress: false

jobs:
  auto-update:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout Live-UI-Update
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare MILAN workspace
        env:
          MILAN_GH_TOKEN: ${{ secrets.MILAN_GH_TOKEN }}
        run: |
          git clone https://x-access-token:${MILAN_GH_TOKEN}@github.com/Ignite-boy/MILAN.git milan
          cd milan
          git config user.name "MILAN Live UI Bot"
          git config user.email "bot@milanlife.in"

      - name: AI generate and patch UI
        working-directory: milan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 ../scripts/milan_ai_update.py || true

      - name: Validate AI changes
        working-directory: milan
        run: |
          if git diff --quiet; then
            echo "NO_AI_CHANGES=true" >> "$GITHUB_ENV"
            echo "No AI changes this cycle."
            exit 0
          fi

          git diff --check

          changed_js="$(git diff --name-only -- '*.js')"
          if [ -n "$changed_js" ]; then
            while IFS= read -r file; do
              [ -n "$file" ] && node --check "$file"
            done <<< "$changed_js"
          fi

          echo "NO_AI_CHANGES=false" >> "$GITHUB_ENV"

      - name: Prepare production marker
        if: env.NO_AI_CHANGES == 'false'
        working-directory: milan
        run: |
          printf '%s\n' "${GITHUB_RUN_ID}" > frontend/milan-build.txt

      - name: Commit and push validated UI
        if: env.NO_AI_CHANGES == 'false'
        working-directory: milan
        env:
          MILAN_GH_TOKEN: ${{ secrets.MILAN_GH_TOKEN }}
        run: |
          git add frontend
          git diff --cached --check
          git commit -m "feat: automated MILAN UI improvement"
          git fetch origin main
          git rebase origin/main
          git -c http.extraheader="AUTHORIZATION: Bearer ${MILAN_GH_TOKEN}" push origin main

      - name: Verify live deployment
        if: env.NO_AI_CHANGES == 'false'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          for i in $(seq 1 12); do
            code="$(curl -L -s -o /tmp/milan-home -w '%{http_code}' --max-time 20 "https://milanlife.in/?_milan_run=${RUN_ID}")"
            marker="$(curl -L -s --max-time 20 "https://milanlife.in/milan-build.txt?_milan_run=${RUN_ID}" || true)"

            echo "Attempt $i: HTTP=$code MARKER=$marker"

            if [ "$code" = "200" ] && [ "$marker" = "$RUN_ID" ]; then
              echo "LIVE DEPLOYMENT VERIFIED"
              exit 0
            fi

            sleep 20
          done

          exit 1

      - name: Roll back failed deployment
        if: failure() && env.NO_AI_CHANGES == 'false'
        working-directory: milan
        env:
          MILAN_GH_TOKEN: ${{ secrets.MILAN_GH_TOKEN }}
        run: |
          git fetch origin main
          bad_commit="$(git rev-parse origin/main)"
          git revert --no-edit "$bad_commit" || true
          git -c http.extraheader="AUTHORIZATION: Bearer ${MILAN_GH_TOKEN}" push origin main || true
