name: MILAN Live Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: milan-live-auto
  cancel-in-progress: false

jobs:
  auto-update:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout Live-UI-Update
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare MILAN workspace
        run: |
          git clone https://github.com/Ignite-boy/MILAN.git milan
          cd milan
          git config user.name "MILAN Live UI Bot"
          git config user.email "bot@milanlife.in"

      - name: AI generate and patch UI
        working-directory: milan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 ../scripts/milan_ai_update.py

      - name: Analyze current MILAN UI
        working-directory: milan
        run: |
          echo "=== MILAN HEAD ==="
          git rev-parse HEAD
          echo "=== FRONTEND FILES ==="
          find frontend -maxdepth 3 -type f | sort | head -n 200
          echo "=== STATUS ==="
          git status --short

      - name: Safe validation
        working-directory: milan
        run: |
          node --check frontend/assets/js/app-page-actions.js
          node --check frontend/assets/js/milan-ui-actions.js

      - name: Commit and push AI UI changes
        working-directory: milan
        env:
          MILAN_GH_TOKEN: ${{ secrets.MILAN_GH_TOKEN }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No AI changes this cycle."
            exit 0
          fi
          git diff --check
          node --check frontend/assets/js/app-page-actions.js
          node --check frontend/assets/js/milan-ui-actions.js
          git add frontend
          git commit -m "feat: automated MILAN UI improvement"
          git -c http.extraheader="AUTHORIZATION: Bearer ${MILAN_GH_TOKEN}" pull --rebase origin main
          git -c http.extraheader="AUTHORIZATION: Bearer ${MILAN_GH_TOKEN}" push origin main

      - name: Live verification
        run: |
          for i in 1 2 3 4 5; do
            code="$(curl -L -s -o /dev/null -w '%{http_code}' --max-time 20 https://milanlife.in/)"
            echo "Attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          exit 1
